<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Ecommerce Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Simple Ecommerce Store</h1>
    <p>Browse products by category</p>
  </header>

  <main>
    <section>
      <h2>Categories</h2>
      <div class="categories">
        <div class="category" onclick="filterByCategory('electronics')">Electronics</div>
        <div class="category" onclick="filterByCategory('clothing')">Clothing</div>
        <div class="category" onclick="filterByCategory('accessories')">Accessories</div>
        <div class="category" onclick="filterByCategory('all')">All Products</div>
      </div>
    </section>

    <section class="filters">
      <input type="number" id="minPrice" placeholder="Min Price">
      <input type="number" id="maxPrice" placeholder="Max Price">
      <button onclick="applyFilters()">Apply Filter</button>
    </section>

    <section>
      <h2>Products</h2>
      <div class="products" id="productList"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
